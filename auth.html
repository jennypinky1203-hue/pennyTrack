<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in or create your PennyTrack account to manage your money.">
    <title>Login or Sign Up | PennyTrack</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body class="auth-page">

    <header class="auth-header">
        <a href="index.html" class="auth-logo">
            <span class="auth-logo-icon">₦</span>
            <span>penny<span class="green-text">Track</span></span>
        </a>

        <a href="index.html" class="back-home">← Back to home</a>
    </header>

    <main class="auth-main">
        <div class="auth-decoration auth-decoration-one"></div>
        <div class="auth-decoration auth-decoration-two"></div>

        <section class="auth-card" aria-labelledby="authTitle">

            <div class="auth-heading">
                <span class="auth-label">YOUR FINANCIAL JOURNEY</span>
                <h1 id="authTitle">Welcome back</h1>
                <p id="authDescription">Log in to continue managing your money.</p>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="Account access">
                <button type="button" class="auth-tab active" id="loginTab" role="tab" aria-selected="true"
                    aria-controls="loginForm">
                    Log In
                </button>

                <button type="button" class="auth-tab" id="signupTab" role="tab" aria-selected="false"
                    aria-controls="signupForm">
                    Sign Up
                </button>
            </div>

            <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input type="email" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="loginPassword">Password</label>
                        <a href="#" id="forgotPassword">Forgot password?</a>
                    </div>

                    <div class="password-field">
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="password-toggle" data-target="loginPassword"
                            aria-label="Show password">Show</button>
                    </div>
                </div>

                <label class="remember-option">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>Remember me</span>
                </label>

                <button type="submit" class="auth-submit">
                    Log In <span aria-hidden="true">→</span>
                </button>

                <p class="auth-switch-text">
                    Don't have an account?
                    <button type="button" class="text-button" data-switch="signup">
                        Sign up
                    </button>
                </p>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signupForm" class="auth-form" hidden>
                <div class="form-group">
                    <label for="signupName">Full name</label>
                    <input type="text" id="signupName" name="name" placeholder="Enter your full name"
                        autocomplete="name" minlength="2" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email address</label>
                    <input type="email" id="signupEmail" name="email" placeholder="you@example.com" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Create password</label>
                    <div class="password-field">
                        <input type="password" id="signupPassword" name="password" placeholder="At least 8 characters"
                            autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" data-target="signupPassword"
                            aria-label="Show password">Show</button>
                    </div>
                    <small class="input-hint">Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="password-toggle" data-target="confirmPassword"
                            aria-label="Show password">Show</button>
                    </div>
                </div>

                <label class="remember-option terms-option">
                    <input type="checkbox" id="agreeTerms" required>
                    <span>I agree to the <a href="#" id="termsLink">Terms of Service</a>.</span>
                </label>

                <button type="submit" class="auth-submit">
                    Create Account <span aria-hidden="true">→</span>
                </button>

                <p class="auth-switch-text">
                    Already have an account?
                    <button type="button" class="text-button" data-switch="login">
                        Log in
                    </button>
                </p>
            </form>

            <div class="auth-security-note">
                <span aria-hidden="true">◇</span>
                <span>Your financial journey starts with a plan.</span>
            </div>

        </section>

        <p class="auth-footer-note">
            Make every penny count.
        </p>
    </main>

    <script src="./js/auth.js"></script>
</body>

</html>
